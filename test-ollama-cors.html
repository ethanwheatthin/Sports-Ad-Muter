<!DOCTYPE html>
<html>
<head>
    <title>Test Ollama CORS</title>
</head>
<body>
    <h1>Test Ollama CORS</h1>
    <button onclick="testOllama()">Test Ollama Connection</button>
    <div id="result"></div>

    <script>
        async function testOllama() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'qwen3-vl:2b',
                        prompt: 'Hello, just testing connection. Respond with "Connection OK".',
                        stream: false
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<div style="color: green;">✅ Success! Response: ${data.response}</div>`;
                } else {
                    resultDiv.innerHTML = `<div style="color: red;">❌ HTTP Error: ${response.status}</div>`;
                }
            } catch (error) {
                if (error.message.includes('CORS')) {
                    resultDiv.innerHTML = `<div style="color: red;">❌ CORS Error: ${error.message}<br><br>
                    <strong>Solution:</strong> Restart Ollama with:<br>
                    <code>set OLLAMA_ORIGINS=* && ollama serve</code></div>`;
                } else {
                    resultDiv.innerHTML = `<div style="color: red;">❌ Error: ${error.message}</div>`;
                }
            }
        }
    </script>
</body>
</html>
